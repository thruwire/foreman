[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foreman-core"
version = "0.4.1"
description = "An agent supervisor and software factory foreman powered by TypeSafe’s Jev model"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Foreman contributors" }]
keywords = ["ai", "agents", "coding-agents", "supervision", "jev"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "keyring>=25,<27",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "typesafe-sdk>=0.2.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1",
]

[project.scripts]
foreman = "foreman.cli:app"

[project.urls]
Homepage = "https://github.com/thruwire/foreman"
Documentation = "https://github.com/thruwire/foreman/tree/main/docs"
Repository = "https://github.com/thruwire/foreman.git"
Issues = "https://github.com/thruwire/foreman/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"foreman.responsibilities" = ["definitions/*.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
